<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:spring="http://www.w3.org/1999/xhtml" lang="EN">
<head>
    <meta charset="UTF-8">
    <title>Refrigerator Map Application</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{../static/css/style.css}"/>
    <link rel="stylesheet" href="https://use.typekit.net/dem2ufl.css">
</head>
<body>

<div class="heading">
    <!-- The th:src attribute is used to reference the image -->
    <a th:href="@{/}">
        <img th:src="@{../static/images/logo.png}" alt="RefrigeratorMap Logo" id="logo"/>
    </a>
</div>
<div class="subPageStyle">

    <h1 class="headingText">Please add a fruit.</h1>
    <form action="#" th:action="@{/addfruit}" th:object="${fruit}" method="POST">

        <!-- Source - https://stackoverflow.com/a
        // Posted by Blejzer
        // Retrieved 2025-12-18, License - CC BY-SA 3.0 -->

        <table>
            <tr>
                <td><label class="paragraphText">Enter a fruit type name:</label></td>
                <td><label>
                    <input type="text" th:field="*{type}" placeholder="Enter a fruit type" class="inputText">
                </label></td>

                <td><label class="paragraphText">Enter a fruit quantity of individual units:</label></td>
                <td>
                    <label>
                        <input type="text" th:field="*{quantity}" placeholder="Enter a quantity:" class="inputText">
                    </label>
                </td>
            </tr>
        </table>
        <button type="submit" value="Submit" class="buttonStatic">Add Fruit</button>

        <div th:if="${#fields.hasErrors()}" class="errorstyle">
            <h2 class="paragraphText">Please correct the following errors in your form:</h2>
            <ul th:each="err : *{#fields.errors()}">
                <li th:text="${err}" class="paragraphText"></li>
            </ul>
        </div>
    </form>
</div>
</body>
