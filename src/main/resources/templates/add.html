<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:spring="http://www.w3.org/1999/xhtml" lang="EN">
<head>
    <meta charset="UTF-8">
    <title>Refrigerator Map Application</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" type="text/css" media="all" th:href="@{../static/css/style.css}"/>
    <link rel="stylesheet" href="https://use.typekit.net/dem2ufl.css">
</head>

<head>
    <meta charset="UTF-8">
    <title>Fridge Map Application</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" type="text/css"
          th:href="@{/Users/willowcook/Downloads/fridge-map/src/main/resources/static/style.css}"/>
</head>
<body>
<div class="heading">
    <a th:href="@{/}">
        <img th:src="@{../static/images/logo.png}" alt="RefrigeratorMap Logo" id="logo"/>
    </a>

</div>
<div class="subPageStyle">

    <h1 class="headingText">Please add a cheese to the cheese drawer.</h1>

    <!--/*@thymesVar id="Cheese" type=""*/-->
    <!-- <form action="index.html" th:action="@{/save}" th:object="${cheese}" method="POST" > -->
    <form action="#" th:action="@{/add}" th:object="${cheese}" method="POST">
        <table>
            <tr>
                <td><label class="paragraphText">Enter a cheese type name:</label></td>
                <td><label>
                    <input type="text" th:field="*{type}" placeholder="Enter a cheese type" class="inputText"
                           autofocus="autofocus">
                </label></td>

                <td><label class="paragraphText">Enter a cheese quantity of individual units:</label></td>
                <td>
                    <label>
                        <input type="text" th:field="*{quantity}" placeholder="Enter a quantity:" class="inputText">
                    </label>
                </td>
            </tr>
        </table>
        <button type="submit" value="Submit" class="buttonStatic">Add Cheese</button>

        <div th:if="${#fields.hasErrors()}" class="errorstyle">
            <h2 class="paragraphText">Please correct the following errors in your form:</h2>
            <ul th:each="err : *{#fields.errors()}" class="paragraphText">
                <li th:text="${err}" class="paragraphText"></li>
            </ul>
        </div>
    </form>
</div>

</body>
